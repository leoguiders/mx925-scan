services:
  mx925-scan:
    build: .
    image: mx925-scan:latest
    # Prebuilt image instead of building locally (remove "build: ." above):
    # image: ghcr.io/<owner>/mx925-scan:latest
    container_name: mx925-scan
    restart: unless-stopped
    # BJNP (UDP/TCP 8612) incl. broadcast - host networking is the least trouble
    network_mode: host
    environment:
      SCANNER_IP: 192.168.1.50          # IP of the printer (use a DHCP reservation)
      # SCANNER_DEVICE: "pixma:MX920_192.168.1.50"  # optional, auto-detected otherwise
      # BJNP_TIMEOUT: "30000"           # ms, default 30000
      # PIXMA_POLL_DELAY_MS: "100"      # delay between image data polls (default 10)
      SCAN_USER: scan                  # shown on the printer as "<user>  <hostname>"
      SCAN_HOSTNAME: paperless          # (max. ~30 characters together)
      OUTPUT_DIR: /output
      PUID: 1000                        # UID/GID of the paperless user
      PGID: 1000
      TZ: Europe/Berlin
      LOG_LEVEL: INFO                   # DEBUG while setting up
      # Straighten documents already in paperless-ngx (>= 3.0) by tagging them
      # PAPERLESS_URL: http://localhost:8000
      # PAPERLESS_TOKEN: <API token from "My profile" in paperless>
      # PAPERLESS_DESKEW_TAG: begradigen
    volumes:
      - ./config:/config
      - /srv/paperless/consume:/output  # your paperless consume directory
